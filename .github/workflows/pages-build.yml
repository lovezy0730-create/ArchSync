name: GitHub Pages (build, verify and deploy)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Static snapshots are public. The generator only includes explicitly
# publishStatic=true projects and never receives private GitHub credentials.
permissions:
  contents: read

concurrency:
  group: github-pages-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Generate public-safe snapshots
        run: pnpm snapshot:generate
      - name: Build GitHub Pages site at /ArchSync/
        run: pnpm build:pages
      - name: Verify published files and scrub secrets
        run: pnpm verify:pages

      # Keep the original ordinary ZIP artifact, useful for PR review.
      - name: Upload preview artifact (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pages-static-site-preview
          path: apps/web/dist
          retention-days: 14
          if-no-files-found: error

      # GitHub Pages requires its specific tar/gzip artifact format.
      # This runs only on trusted main/manual executions, never on PRs.
      - name: Upload official GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
