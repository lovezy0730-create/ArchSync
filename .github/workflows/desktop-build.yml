name: Windows Desktop Build

on:
  pull_request:
    branches: [main, feat/v1.2-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gates
        shell: pwsh
        run: |
          # PowerShell does not stop on a failed native command: without these
          # checks a lint/typecheck failure would be hidden by a passing test
          # run (the step's exit code is the last command's).
          pnpm lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build desktop (bundle + web dist + agent bundle + electron-builder)
        run: node apps/desktop/build.mjs --package

      # 启动冒烟：独立 agent.cjs（与打包版共享同一 bundle 与资源解析逻辑）
      - name: Smoke test bundled agent
        run: node scripts/agent-smoke.cjs

      - name: Unpacked Windows GUI E2E
        env:
          ARCHSYNC_E2E_GITHUB: '1'
          ARCHSYNC_E2E_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/rc5-desktop-e2e.mjs

      - name: Portable Windows GUI E2E
        shell: pwsh
        run: |
          $env:ARCHSYNC_E2E_EXE = (Get-ChildItem apps/desktop/release/ArchSync-Portable-*.exe | Select-Object -First 1).FullName
          $env:ARCHSYNC_E2E_PORTABLE = '1'
          if (-not $env:ARCHSYNC_E2E_EXE) { throw 'Portable EXE missing' }
          node scripts/rc5-desktop-e2e.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install and test Setup EXE
        shell: pwsh
        run: |
          $setup = (Get-ChildItem apps/desktop/release/ArchSync-Setup-*.exe | Select-Object -First 1).FullName
          if (-not $setup) { throw 'Setup EXE missing' }
          $installDir = Join-Path $env:RUNNER_TEMP 'archsync-rc5-installed'
          $process = Start-Process -FilePath $setup -ArgumentList @('/S', "/D=$installDir") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Setup failed: $($process.ExitCode)" }
          $env:ARCHSYNC_E2E_EXE = Join-Path $installDir 'ArchSync.exe'
          if (-not (Test-Path -LiteralPath $env:ARCHSYNC_E2E_EXE)) { throw 'Installed executable missing' }
          node scripts/rc5-desktop-e2e.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record versions
        run: |
          "commit=$(git rev-parse HEAD)" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Get-ChildItem apps/desktop/release -Filter *.exe | ForEach-Object {
            "$($_.Name) = $([math]::Round($_.Length/1MB,1)) MB" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          }
        shell: pwsh

      - name: SHA256
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/release -Filter *.exe | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLower())  $($_.Name)"
          } | Set-Content apps/desktop/release/SHA256SUMS.txt
          Get-Content apps/desktop/release/SHA256SUMS.txt
      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: archsync-portable-rc5
          path: |
            apps/desktop/release/ArchSync-Portable-*.exe
            apps/desktop/release/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
      - name: Upload setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: archsync-setup-rc5
          path: |
            apps/desktop/release/ArchSync-Setup-*.exe
            apps/desktop/release/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
      - name: Upload Windows test evidence
        uses: actions/upload-artifact@v4
        with:
          name: archsync-windows-evidence
          path: |
            apps/desktop/release/SHA256SUMS.txt
            apps/desktop/release/evidence/*.png
          retention-days: 30
          if-no-files-found: error
