appId: lovezy.archsync.desktop
productName: ArchSync
copyright: ArchSync contributors

directories:
  output: release
  buildResources: .

files:
  - dist-electron/**/*
  - src/main.cjs
  - icon.png
  - ../../apps/web/dist/**/*
  - ../../apps/server/src/**/*
  - ../../packages/contracts/src/**/*
  - ../../packages/config/src/**/*
  - ../../packages/scanner/src/**/*
  - ../../packages/graph/src/**/*
  - ../../package.json
  - ../../pnpm-workspace.yaml
  - ../../apps/server/package.json
  - ../../apps/web/package.json
  - ../../packages/contracts/package.json
  - ../../packages/config/package.json
  - ../../packages/scanner/package.json
  - ../../packages/graph/package.json
  - ../../tsconfig.base.json
  - ../../.archsync/project.yaml
  - ../../examples/**/*
  - ../../node_modules/**/*

extraMetadata:
  main: dist-electron/main.cjs

win:
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]
  icon: icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ArchSync-Setup-${version}.exe

portable:
  artifactName: ArchSync-Portable-${version}.exe

asarUnpack:
  - "**/*.node"
