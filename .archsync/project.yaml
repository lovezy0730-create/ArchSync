schemaVersion: 1
project:
  id: archsync
  name: ArchSync（本仓库真实自描述）
  github:
    owner: lovezy0730-create
    repo: ArchSync
    defaultBranch: main
  root: "."
  # This repository is PUBLIC and dogfoods ArchSync: its own architecture and
  # real GitHub issues/PRs are published to the static site.
  publishStatic: true
  publishPublicGithubData: true

layers:
  - id: web
    label: 前端
    order: 1
  - id: server
    label: 服务
    order: 2
  - id: core
    label: 核心包
    order: 3
  - id: infra
    label: 工程基础
    order: 4

modules:
  - id: workbench-ui
    label: 架构工作台界面
    layer: web
    description: React Flow 交互式架构图、模块详情、筛选与双模式数据层
    owners: []
    paths: ["apps/web/src/**"]
    issues: []
    plannedDependsOn: [snapshot-api, presence-ws]
    acceptance:
      requiredIssues: []
      requiredChecks: [verify]
      manualApproval: false

  - id: static-snapshots
    label: 静态快照生成器
    layer: server
    description: 构建时生成公开安全静态快照与历史索引
    owners: []
    paths: ["apps/server/src/pages/**"]
    issues: []
    plannedDependsOn: [graph-engine, scanner-core, config-contracts]
    acceptance:
      requiredIssues: []
      requiredChecks: [verify]
      manualApproval: false

  - id: server-core
    label: 服务端装配
    layer: server
    description: 服务入口、环境配置与项目发现
    owners: []
    paths: ["apps/server/src/index.ts", "apps/server/src/env.ts", "apps/server/src/projects.ts"]
    plannedDependsOn: [graph-engine, scanner-core, config-contracts, github-adapter]
    issues: []
    acceptance:
      requiredIssues: []
      requiredChecks: [verify]
      manualApproval: false

  - id: snapshot-api
    label: 快照 REST API
    layer: server
    description: 项目列表、快照、模块详情、备注与同步任务接口
    owners: []
    paths: ["apps/server/src/routes.ts"]
    issues: []
    plannedDependsOn: [graph-engine, state-store, server-core]
    acceptance:
      requiredIssues: []
      requiredChecks: [verify]
      manualApproval: false

  - id: presence-ws
    label: 实时协作 Presence
    layer: server
    description: WebSocket 房间、光标/选中广播、心跳与会话超时
    owners: []
    paths: ["apps/server/src/ws.ts"]
    issues: []
    plannedDependsOn: [state-store]
    acceptance:
      requiredIssues: []
      requiredChecks: [verify]
      manualApproval: false

  - id: sync-engine
    label: 快照构建与监听
    layer: server
    description: 扫描-合并-发布管线与本地文件 watcher
    owners: []
    paths: ["apps/server/src/sync/**"]
    issues: []
    plannedDependsOn: [graph-engine, scanner-core, state-store]
    acceptance:
      requiredIssues: []
      requiredChecks: [verify]
      manualApproval: false

  - id: agent-api
    label: Agent 接口
    layer: server
    description: 供 Codex/GLM/DSH 等 Agent 使用的 CLI 与结构化上下文接口
    owners: []
    paths: ["apps/server/src/agent/**"]
    issues: []
    plannedDependsOn: [graph-engine, scanner-core, config-contracts]
    acceptance:
      requiredIssues: []
      requiredChecks: [verify]
      manualApproval: false

  - id: auth-sessions
    label: 访问码鉴权
    layer: server
    description: 访问码登录、会话 Cookie 与统一 API 鉴权门
    owners: []
    paths: ["apps/server/src/auth.ts"]
    issues: []
    plannedDependsOn: []
    acceptance:
      requiredIssues: []
      requiredChecks: [verify]
      manualApproval: false

  - id: config-contracts
    label: 配置与契约
    layer: core
    description: YAML 解析校验与共享 Zod 数据契约
    owners: []
    paths: ["packages/contracts/src/**", "packages/config/src/**"]
    issues: []
    plannedDependsOn: []
    acceptance:
      requiredIssues: []
      requiredChecks: [verify]
      manualApproval: false

  - id: scanner-core
    label: 本地扫描器
    layer: core
    description: git 基线、工作区文件、未提交覆盖层与依赖导入分析
    owners: []
    paths: ["packages/scanner/src/**"]
    issues: []
    plannedDependsOn: [config-contracts]
    acceptance:
      requiredIssues: []
      requiredChecks: [verify]
      manualApproval: false

  - id: graph-engine
    label: 图谱合并引擎
    layer: core
    description: 规划/扫描/协作三源合并与状态判定矩阵
    owners: []
    paths: ["packages/graph/src/**"]
    issues: []
    plannedDependsOn: [config-contracts, scanner-core]
    acceptance:
      requiredIssues: []
      requiredChecks: [verify]
      manualApproval: false

  - id: state-store
    label: 状态存储
    layer: infra
    description: JSON 文件状态存储（快照版本、备注修订、任务）
    owners: []
    paths: ["apps/server/src/store/**"]
    issues: []
    plannedDependsOn: []
    acceptance:
      requiredIssues: []
      requiredChecks: [verify]
      manualApproval: false

  - id: github-adapter
    label: GitHub 数据适配
    layer: infra
    description: 匿名公开 API 与令牌授权模式的 Issues/PR/Checks/文件适配
    owners: []
    paths: ["apps/server/src/github.ts"]
    issues: []
    plannedDependsOn: [config-contracts]
    acceptance:
      requiredIssues: []
      requiredChecks: [verify]
      manualApproval: false

  - id: dev-tooling
    label: 开发与构建工具链
    layer: infra
    description: monorepo 脚本、lint/typecheck/test/build 与产物验证
    owners: []
    paths: ["scripts/**", ".github/workflows/**"]
    issues: []
    plannedDependsOn: []
    acceptance:
      requiredIssues: []
      requiredChecks: [verify]
      manualApproval: false
