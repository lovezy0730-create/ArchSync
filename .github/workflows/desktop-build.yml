name: Windows Desktop Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gates
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build desktop (bundle + web dist + agent bundle + electron-builder)
        run: node apps/desktop/build.mjs --package

      # 启动冒烟：独立 agent.cjs（与打包版共享同一 bundle 与资源解析逻辑）
      - name: Smoke test bundled agent
        run: node scripts/agent-smoke.cjs

      # 真实 EXE 启动冒烟：运行 electron-builder 产出的 win-unpacked/ArchSync.exe，
      # 验证 Electron main + utilityProcess agent + healthz 全链路（与用户双击的启动逻辑一致）
      - name: Smoke test packaged EXE
        run: |
          $exe = 'apps/desktop/release/win-unpacked/ArchSync.exe'
          if (-not (Test-Path $exe)) { throw "packaged exe missing: $exe" }
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          $passed = $false
          try {
            $h = Invoke-WebRequest -Uri 'http://127.0.0.1:4310/healthz' -UseBasicParsing -TimeoutSec 15
            if ($h.StatusCode -eq 200) {
              $passed = $true
              Write-Host 'packaged EXE smoke: healthz 200 OK (Electron + utilityProcess agent)'
            }
          } catch {
            Write-Host "healthz probe: $($_.Exception.Message)"
          } finally {
            Get-Process -Name ArchSync -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 3
            $left = Get-Process -Name ArchSync -ErrorAction SilentlyContinue
            if ($left) { Write-Host 'WARNING: ArchSync processes remain after kill' }
          }
          if (-not $passed) { throw 'packaged EXE smoke test failed: healthz not reachable' }

      - name: Record versions
        run: |
          "commit=$(git rev-parse HEAD)" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Get-ChildItem apps/desktop/release -Filter *.exe | ForEach-Object {
            "$($_.Name) = $([math]::Round($_.Length/1MB,1)) MB" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          }
        shell: pwsh

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: archsync-windows
          path: |
            apps/desktop/release/*.exe
          retention-days: 30
          if-no-files-found: error
